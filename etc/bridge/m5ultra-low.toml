purpose = "A Mac Studio (M5 Ultra, 96 GiB, headless), one of the four joining the pair, by the M5's rule (a node of more flops and bandwidth than the Mini, less to gain from memoization): the least whole GiB that holds the whole E2B model alone at the engine's whole page geometry, so its part of any E2B program on any membership fits (metal-microbench tools/mesh/programs.py plans of a membership of one, counted from the model file's header 2026-10-15: plans({'bs': 1, 'ctx_max': 256000}, structure(), pages=16000)): weights 8.66 GiB, the KV pool of 16000 pages and the strip with its chunk tables 4.47 GiB, the crossed capacity 0.05 GiB, the conversion staging 0.06 GiB, a call's per-layer inputs 0.03 GiB: 13.27 GiB (10.56 GiB on the streamed codes export); the larger models alone at a call's own pages take more (12B 16.46 GiB at 4,096 positions, 26B-A4B 28.25 GiB), so a Studio holds its part of them on memberships whose windows together hold the whole, which the planner fits to the windows (node-info window). It leaves the node 96 - 14 - 0.056 (the region's tables beside the window, 64.5 bytes a window page and 0.5 MiB, rdma/mesh.h mesh_layout, from MESH_VERSION 111) - 1.6 (base wired, the Mini's figure until the Studio's is read) - 1.5 (macOS anonymous) - 0.9 (the rank's process beside its leases) - 2.95 (the Neural Engine's own copy, at most every FFN column of the model at fp16) = 74.99 GiB; the Mini's rule (the most that leaves a 2 GiB margin) would give 86 GiB. 14 extents, within the 100 one-GiB extents the pair's devices register (max_mr; each port's device checks its own as it comes up and refuses that port where the window has more, logged and retried, never clamping the window: design/recovery.md#registration). The window is the operator's decision; m5ultra-headless.toml is the other rule's."
window_gib = 14
ledger = false
