purpose = "The M5 Max (128 GiB) as a userspace workstation in the E2B pair under test, below the Mini's window (more flops and bandwidth, less to gain from memoization): the least whole GiB that holds what its rank leases (metal-microbench d27fcd9, docs/placement.md#memory: tools/mesh/programs.py plans, which each call's record carries and the rank holds its part to; a count of its rule from the model file's header, 2026-10-15, before programs.py plans was first run) for its larger part of the pair's heads programs, d5a4040e726d5b44's (6 of 8 heads, 4608 and 9216 FFN columns), at the engine's whole page geometry, and the whole model alone: weights 7.81 GiB (its Neural Engine shares' gate, up, down and norm are the layer's own), the KV pool of 16000 pages and the strip with its chunk tables 4.47 GiB (a call leases its own pages: 108.5 MiB at the pair's 128 positions), the crossed capacity 0.05 GiB, the conversion staging 0.06 GiB, a call's per-layer inputs 0.03 GiB, its communicator's session 0.02 GiB: 12.45 GiB, 1.55 GiB to spare, and the whole model alone 13.27 GiB, 0.73 GiB to spare; the region's tables beside the window take 0.056 GiB more (64.5 bytes a window page and 0.5 MiB from MESH_VERSION 111, rdma/mesh.h mesh_layout; 0.97 GiB at 110, whose rows each carried a publication's targets), and a served engine on this node (server/bridge.py) would lease its model and pool from the same window, which does not hold them. Each exclusive flow carries a frame at least every 5 us on a queue pair of its own (keepalive_us, design/bridge-and-ipc.md#keepalive): the Mini's Thunderbolt RDMA path, quiet for the 40-50 us of a layer's window, completed its next SEND in 6.2 us and signalled a peer's frame up to 10.6 us after it was sent, where after recent traffic it took 2.5-2.7 us (metal-microbench output_data/split-20261017 completion.py, contention.py); a host-path exchange read 12.8-13.8 us a round after gaps of 0-10 us and 16.5-18.8 after 40-160 us (gapprobe2)."
