purpose = "The Mac mini (M4 Pro, 24 GiB, headless) in the E2B pair under test, a flops- and bandwidth-starved peer that benefits from memoization: the region holds what its rank leases (metal-microbench d27fcd9, docs/placement.md#memory: tools/mesh/programs.py plans, which each call's record carries and the rank holds its part to; a count of its rule from the model file's header, 2026-10-15, before programs.py plans was first run) for its part of the pair's heads program 2057c7fae8c1930a (2 of 8 heads, 1536 and 6144 FFN columns) at the engine's whole page geometry: weights 6.64 GiB (its Neural Engine shares' gate, up, down and norm are the layer's own), the KV pool of 16000 pages and the strip with its chunk tables 4.47 GiB (a call leases its own pages: 108.5 MiB at the pair's 128 positions), the crossed capacity 0.05 GiB, the conversion staging 0.06 GiB, a call's per-layer inputs 0.03 GiB, its communicator's session 0.02 GiB: 11.28 GiB, 4.72 GiB to spare, and the whole model alone (13.27 GiB); it leaves the node 24 - 16 - 0.06 (the region's tables beside its arena, 64.5 bytes an arena page and 0.5 MiB from MESH_VERSION 111, rdma/mesh.h mesh_layout; 1.11 GiB, 1,136.5 bytes an arena page and 0.5 MiB, at 110, whose rows each carried a publication's targets) - 1.6 (base wired) - 1.5 (macOS anonymous) - 0.9 (the rank's process beside its leases) - 0.47 (the Neural Engine's own copy of its columns) = 3.47 GiB (2.42 at 110), 1.47 GiB past a 2 GiB margin; 17 GiB would leave 2.46. Each exclusive flow carries a frame at least every 5 us on a queue pair of its own (keepalive_us, design/transport.md): the Mini's Thunderbolt RDMA path, quiet for the 40-50 us of a layer's stretch, completed its next SEND in 6.2 us and signalled a peer's frame up to 10.6 us after it was sent, where after recent traffic it took 2.5-2.7 us (metal-microbench output_data/split-20261017 completion.py, contention.py); a host-path exchange read 12.8-13.8 us a round after gaps of 0-10 us and 16.5-18.8 after 40-160 us (gapprobe2)."
