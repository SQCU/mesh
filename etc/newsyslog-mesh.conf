# The mesh services' logs (/usr/local/mesh/log), rotated by the system's newsyslog (it runs every 30 minutes)
# past 4 MB, two kept; installed by install.sh as /etc/newsyslog.d/io.mesh.conf.  A script's log (exec >>) starts
# its new file at the script's next run; a launchd job's (StandardOutPath, StandardErrorPath) keeps writing its
# open file until the job restarts.  A job that runs
# as the admin user (UserName: the observer, node-info) logs under log/user, which the user owns, its files rotated as
# the user's: launchd opens a job's log files as the job's user, and one it cannot open fails the job's every start
# (EX_CONFIG, 78): the Mini's observer, from its restart on 2026-10-15 that loaded the definition naming the user
# (15bb3c6), which install.sh had kept from loading as a retained job until then.  install.sh writes __MESH_OWNER__ as
# the user's uid:gid, which stays valid if the account is renamed.
# logfilename                  [owner:group]  mode  count  size(KB)  when  flags
/usr/local/mesh/log/*.log      root:wheel     644   2      4096      *     GN
/usr/local/mesh/log/user/*.log  __MESH_OWNER__      644   2      4096      *     GN
