# The mesh services' logs (/usr/local/mesh/log), rotated by the system's newsyslog (it runs every 30 minutes)
# past 4 MB, two kept; installed by install.sh as /etc/newsyslog.d/io.mesh.conf.  A script's log (exec >>) starts
# its new file at the script's next run; a launchd job's (StandardOutPath, StandardErrorPath) keeps writing its
# open file until the job restarts.  A bridge's own log moves itself past its cap (rdma/mesh-disk.h).
# logfilename                  [owner:group]  mode  count  size(KB)  when  flags
/usr/local/mesh/log/*.log      root:wheel     644   2      4096      *     GN
