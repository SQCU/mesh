// =========
//  payload
// =========
set g_payload				0 "Payload: push the cart along its track to your team's goal"
set g_payload_default_teams		2 "default number of teams for maps that aren't payload-specific"
set g_payload_teams_override		0 "use a specific number of teams in payload games (minimum 2), disables plc_team entities"
set g_payload_point_limit		10 "capture limit in payload mode"
set g_payload_point_leadlimit		0 "lead limit in payload mode"
set g_payload_speed			30 "track units per second per unit of net push weight"
set g_payload_max_speed			200 "hard cap on cart speed in track units per second"
set g_payload_push_radius		160 "horizontal radius in which a player counts as pushing"
set g_payload_push_height		96 "vertical half-band in which a player counts as pushing"
set g_payload_push_cap			3 "maximum number of players per team that contribute push weight"
set g_payload_push_falloff		1 "geometric weight of each additional pusher; 1 = linear, 0.5 = diminishing"
set g_payload_idle_time			8 "seconds of zero occupancy before the cart rolls back"
set g_payload_rollback_speed		20 "rollback speed in track units per second"
set g_payload_score_rate		0.01 "team score per track unit of progress toward a goal"
set g_payload_block_rate		1 "player block score per second while the cart is stalled"
set g_payload_stall_eps			1 "cart speed below which the cart counts as stalled"
set g_payload_round_timelimit		300 "round time limit in seconds"
set g_payload_mesh_node			1 "peer mesh node the payload solver runs on"
set g_payload_mesh_retry		60 "seconds between mesh_open retries while the bridge is down"
set g_payload_warmup			5 "time players have to wait before the round starts"

seta hud_panel_modicons_payload_layout 1 "0: bar only, 1: bar and progress percentage"
