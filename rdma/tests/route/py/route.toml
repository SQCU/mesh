# The routing policy's training and measurement (python -m route COMMAND). Paths relative to this file. Any key can be
# set on the command line: --set section.key=value.

[run]
name = "train"                          # a cluster run's name: its logs cluster.dir/NAME-RANK.jsonl
fabric = "../../fabric-20261119.txt"    # the measured cluster (tests/fabric-*.txt)
steps = 200                             # learning steps (0: none)
rate = 1e-3                             # Adam's step
theta_seed = 20261119                   # theta's initialization, every rank's the same
data_seed = 20261119                    # the distribution's draws: data_seed and the rank
theta_in = ""                           # continue from these parameters (fp32: NetLayout's or the earlier layout's)
theta = ""                              # write the trained parameters (fp32, the optimizer's master copy)
theta_int8 = ""                         # write the int8 weights as deployed (tests/switch.c's ROUTE_THETA)
argmax = false                          # every draw its table's most probable split (comparing trajectories)
rank = 0
world = 1
mesh_id = ""                            # the bootstrap root's host:port (world > 1)
telemetry = "/tmp/route-telemetry-{rank}"
library = "../libroute.dylib"
metallib = "../route.metallib"

[capacity]                              # buffers held from the start
forward_rows = 262144                   # a forward's context rows (the runs in flight: these over a fabric's most contexts)
learn_runs = 1024                       # a learning batch's runs
refreshes = 4                           # a learning window's refreshes, at most

[distribution]                          # cases.py
online = false                          # the deployment's distribution instead of the training one
fabrics = 2048                          # random fabrics drawn at the start
pool = 4096                             # end states kept for later windows' starts
pool_replace = 0.05                     # once full, the chance a new end state replaces a kept one

[evaluation]
at = ["start", "end"]                   # when rank 0 measures the policy on the measured cluster
ranks = [0]

[report]
interval = 1.0                          # seconds between telemetry records

[cluster]                               # python -m route cluster ...: rank i on hosts[i]
hosts = ["mdots-Mac-Studio-3-ts", "m5ult2-ts", "mdots-Mac-Studio-ts", "mdots-Mac-Studio-2-ts"]
root = "10.0.0.14"                      # rank 0's address on the mesh, for the bootstrap
dir = "~/route-int8/w"                  # where the sources unpack and build on each host
python = "~/mesh-runtime/runtime-current/.venv/bin/python"   # bin/mesh-runtime-install.sh's runtime
