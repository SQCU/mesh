[project]
name = "mesh-runtime"
version = "0.3.0"
description = "The mesh services' Python runtime (bin/mesh-runtime-install.sh): numpy, mlx and cffi (the headers' bindings, rdma/mesh_c_build.py) under .python-version"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.2", "mlx==0.32.2", "cffi==2.1.1"]

[tool.uv]
package = false
