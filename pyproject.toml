[project]
name = "mesh-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.2",
  "numpy==2.5.2",
]

[tool.uv]
package = false

[tool.mesh.application]
sources = ["rdma", "xonotic/solver", "xonotic/payload", "bin/mesh-application.py", "bin/mesh-python", "bin/mesh-runtime-install.sh", "bin/mesh-runtime-id.py", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["__pycache__", "*.pyc", "xonotic/solver/strat/runs"]
modules = ["solver.strat.strat_responder", "solver.strat.matrix_worker", "solver.strat.curriculum", "solver.strat.joracle.server"]
