<!doctype html><html><head><meta charset="utf-8"><title>mesh page-table phase space</title>
<style>
 :root{--bg:#07080b;--fg:#c8d2e0;--dim:#5a6577;--hi:#7fd4ff;--warn:#ffb454}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
 #c{position:fixed;inset:0}
 #hud{position:fixed;top:0;left:0;padding:14px 16px;pointer-events:none;text-shadow:0 0 8px #000}
 h1{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);margin:0 0 10px}
 table{border-collapse:collapse} td{padding:1px 12px 1px 0;white-space:nowrap}
 td.k{color:var(--dim)} td.v{color:var(--fg)} .down{color:var(--warn)}
 .node{margin-bottom:12px} .name{color:var(--hi);letter-spacing:.1em}
 #foot{position:fixed;bottom:0;left:0;padding:12px 16px;color:var(--dim);pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div id="foot">axes: free / posted / with-app, interval means normalised by pool size &middot; head size is the spread within the interval &middot; trail is the last 600 samples &middot; each stream runs between two nodes\u2019 real positions, sized by that node\u2019s measured page delta</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const S = {nodes:{}, period:2};
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .01, 100);
cam.position.set(2.1,1.5,2.4); cam.lookAt(0.35,0.3,0.35);
const R = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.setSize(innerWidth,innerHeight);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});

// the unit cube the phase point lives in: free, posted, sending over pool size
const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
  new THREE.LineBasicMaterial({color:0x1b2430}));
box.position.set(.5,.5,.5); scene.add(box);
for(const [d,col] of [[[1,0,0],0xff6b6b],[[0,1,0],0x6bff9e],[[0,0,1],0x6bb6ff]]){ // free, posted, with-app
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(...d)]);
  scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:col})));
}

const PALETTE=[0x7fd4ff,0xffb454,0x9effa0,0xff8fd0,0xc4a6ff];
const COL={}; const colorOf=n=>COL[n]??(COL[n]=PALETTE[Object.keys(COL).length%PALETTE.length]);
const tracks = {};
function track(name){
  if(tracks[name]) return tracks[name];
  const N=600;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
  g.setDrawRange(0,0);
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:colorOf(name),transparent:true,opacity:.55}));
  const head=new THREE.Mesh(new THREE.SphereGeometry(.018,16,16),
                            new THREE.MeshBasicMaterial({color:colorOf(name)}));
  scene.add(line); scene.add(head);
  return tracks[name]={line,head,g,N};
}

// One stream per ordered pair of nodes. Endpoints are the two nodes' actual
// phase-space positions, so if a node moves in the cube its traffic moves with
// it. Count is that source node's measured page delta. Nothing here is placed
// at a constant.
const PN=20000;
function stream(){
  const g=new THREE.BufferGeometry();
  const seed=new Float32Array(PN);
  for(let i=0;i<PN;i++) seed[i]=Math.random();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(PN*3),3));
  g.setAttribute('seed',new THREE.BufferAttribute(seed,1));
  g.setDrawRange(0,0);
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uA:{value:new THREE.Vector3()},uB:{value:new THREE.Vector3()},
              uC:{value:new THREE.Color(0x7fd4ff)}},
    vertexShader:`attribute float seed; uniform float uT; uniform vec3 uA,uB; varying float vA;
      void main(){
        float p = fract(seed*7.13 + uT*0.35);
        vec3 pos = mix(uA,uB,p);
        vec3 n = normalize(cross(uB-uA, vec3(0.0,1.0,0.0))+vec3(1e-4));
        pos += n * 0.09 * sin(p*3.14159) * sin(seed*29.0);
        pos.y += 0.10*sin(p*3.14159);
        vA = sin(p*3.14159);
        gl_Position = projectionMatrix*modelViewMatrix*vec4(pos,1.0);
        gl_PointSize = 1.5 + 2.5*vA; }`,
    fragmentShader:`varying float vA; uniform vec3 uC;
      void main(){ vec2 d=gl_PointCoord-0.5; if(dot(d,d)>0.25) discard;
        gl_FragColor=vec4(uC, vA*0.55); }`});
  const pts=new THREE.Points(g,m); scene.add(pts); return {g,m};
}
const streams={};

const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'G':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':''+n;
function hud(){
  let h='<h1>mesh page-table phase space</h1>';
  for(const name of Object.keys(S.nodes)){
    const s=S.nodes[name].at(-1); if(!s) continue;
    h+=`<div class="node"><div class="name">${name}</div><table>`;
    if(!s.up){ h+=`<tr><td class="k">state</td><td class="v down">no bridge running</td></tr>`; }
    else{
      const pool=s.pool||1;
      const rows=[['region',`${((s.pool+s.arena)*s.pgsz/1e9).toFixed(2)} GB  pool ${fmt(pool)}  arena ${fmt(s.arena)}`],
                  ['free',`${fmt(s.free)} ±${s.sd_free}`],
                  ['posted',`${fmt(s.recv)} ±${s.sd_recv}`],
                  ['forwarding',`${fmt(s.send)}`],
                  ['with app',`${fmt(s.app)} ±${s.sd_app}`],
                  ['census',`${fmt(s.free+s.recv+s.send+s.app)} / ${fmt(pool)}`],
                  ['rejected',`${fmt(s.bad||0)}`],
                  ['sent/recvd',`${fmt(s.sent)} / ${fmt(s.recvd)}`],
                  ['client',s.client?`pid ${s.client}`:'none']];
      for(const [k,v] of rows) h+=`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`;
    }
    h+='</table></div>';
  }
  document.getElementById('hud').innerHTML=h;
}

let lastTotal=0;
function apply(){
  for(const name of Object.keys(S.nodes)){
    const hs=S.nodes[name].filter(x=>x.up); if(!hs.length) continue;
    const t=track(name), pos=t.g.attributes.position.array;
    const n=Math.min(hs.length,t.N);
    for(let i=0;i<n;i++){
      const s=hs[hs.length-n+i], pool=Math.max(1,s.pool);
      pos[3*i]=s.free/pool; pos[3*i+1]=s.recv/pool; pos[3*i+2]=s.app/pool;
    }
    t.g.setDrawRange(0,n); t.g.attributes.position.needsUpdate=true;
    t.g.computeBoundingSphere();
    const s=hs.at(-1),pool=Math.max(1,s.pool);
    t.head.position.set(s.free/pool, s.recv/pool, s.app/pool);
    // the head grows with the spread inside the interval, so a pool that is
    // churning looks different from one that is merely sitting somewhere
    const sd=Math.hypot(s.sd_free,s.sd_recv,s.sd_app)/pool;
    t.head.scale.setScalar(1+18*sd);
  }
  // one stream per source node, from its head to every other node's head,
  // sized by that node's own measured page delta since the previous sample
  const names=Object.keys(S.nodes).filter(n=>tracks[n]);
  for(const src of names) for(const dst of names){
    if(src===dst) continue;
    const key=src+'>'+dst;
    if(!streams[key]) streams[key]=stream();
    const st=streams[key], hs=S.nodes[src].filter(x=>x.up);
    if(hs.length<2){ st.g.setDrawRange(0,0); continue; }
    const d=Math.max(0,hs.at(-1).sent-hs.at(-2).sent);
    st.m.uniforms.uA.value.copy(tracks[src].head.position);
    st.m.uniforms.uB.value.copy(tracks[dst].head.position);
    st.m.uniforms.uC.value.setHex(colorOf(src));
    st.g.setDrawRange(0,Math.min(PN,Math.round(d/200)));
  }
  hud();
}

async function poll(){
  try{ const r=await fetch('/data.json'); const j=await r.json(); S.nodes=j.nodes; S.period=j.period; apply(); }
  catch(e){}
  setTimeout(poll, 1000);
}
poll();

let th=0;
(function loop(t){ requestAnimationFrame(loop);
  th=t*0.0002; cam.position.set(0.5+2.0*Math.cos(th),1.35,0.5+2.0*Math.sin(th));
  cam.lookAt(0.4,0.35,0.4);
  for(const k in streams) streams[k].m.uniforms.uT.value=t*0.001;
  R.render(scene,cam); })(0);
</script></body></html>
